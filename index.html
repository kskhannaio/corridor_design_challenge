<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madiwala 100 Ft Road</title>
<meta name="description" content="A tactical urbanism study of 100 Feet Road (Mahayogi Vemana Road) between the Koramangala Water Tank junction and Madiwala underpass, Bengaluru.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e6e2d9; --soft: #f4f1ea;
    --accent: #e4572e; --good: #2f9e44; --warn: #e8a200; --bad: #c92a2a; --violet: #7048e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141413; --panel:#1f1f1d; --ink:#f0eee8; --muted:#a3a19a; --line:#34332f; --soft:#292826; }
  }
  :root[data-theme="dark"] { --bg:#141413; --panel:#1f1f1d; --ink:#f0eee8; --muted:#a3a19a; --line:#34332f; --soft:#292826; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  button { font: inherit; color: inherit; }

  /* ---------- story panel ---------- */
  .story { position: absolute; top: 16px; left: 16px; bottom: 16px; width: 380px; z-index: 2;
    display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.14); overflow: hidden; }
  .story-head { padding: 16px 20px 0; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
  .story-head h1 { font-size: 17px; margin: 0; line-height: 1.3; }
  .grab { display: none; }
  .tabs { display: flex; gap: 2px; padding: 12px 14px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: none; padding: 8px 8px 10px; cursor: pointer; color: var(--muted); font-size: 14px;
    white-space: nowrap; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .story-body { flex: 1; overflow-y: auto; padding: 18px 20px 8px; }
  .story-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px;
    border-top: 1px solid var(--line); font-size: 13px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { background: var(--soft); }
  .btn[disabled] { opacity: .35; cursor: default; }
  .linkbtn { border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); text-decoration: underline; font-size: 13px; }

  .headline { font-size: 23px; line-height: 1.2; font-weight: 700; margin: 0 0 10px; letter-spacing: -.01em; }
  .lede { margin: 0 0 14px; }
  .lede strong { font-weight: 650; }
  p.small, .small { font-size: 13px; color: var(--muted); }
  .kpis { display: grid; gap: 8px; margin: 4px 0 16px; }
  .kpi { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; background: var(--soft);
    border-radius: 10px; padding: 10px 12px; border: 0; text-align: left; cursor: pointer; width: 100%; }
  .kpi:hover { outline: 1px solid var(--line); }
  .kpi b { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 13px; line-height: 1.35; }
  .kpi small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* mini legend */
  .key { list-style: none; margin: 4px 0 14px; padding: 12px; display: grid; gap: 7px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 10px; }
  .key li { display: flex; align-items: center; gap: 9px; }
  .sw { flex: none; display: inline-block; }
  .sw-road { width: 22px; height: 5px; border-radius: 3px; background: var(--accent); }
  .sw-gap { width: 22px; height: 6px; border-radius: 3px; background: var(--bad); }
  .sw-ok { width: 22px; height: 10px; border-radius: 3px; background: rgba(47,158,68,.45); }
  .sw-wall { width: 22px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(135deg, #6b5a49 0 3px, #d9cbb8 3px 6px); }
  .sw-cross { width: 14px; height: 14px; border-radius: 50%; background: var(--good); border: 3px solid #1b7a3a; }
  .sw-jn { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #1d1d1b; }
  .sw-need { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 3px solid var(--violet); }
  .sw-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #1d1d1b; }
  .sw-ring { width: 22px; height: 0; border-top: 3px dotted var(--ink); }
  .sw-cons { width: 22px; height: 8px; border-radius: 2px; background: repeating-linear-gradient(135deg, #8a5a2b 0 3px, #f0c27b 3px 6px); }
  .jn { width: 18px; height: 18px; border-radius: 50%; background: #1d1d1b; color: #fff; font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; flex: none; }

  /* folds */
  details.fold { border-top: 1px solid var(--line); padding: 10px 0; }
  details.fold:last-of-type { border-bottom: 1px solid var(--line); }
  details.fold > summary { cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; }
  details.fold[open] > summary::before { transform: rotate(45deg); }
  details.fold > summary .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 13px; }
  .fold-body { padding-top: 8px; font-size: 13px; }
  .fold-body ul { margin: 0; padding-left: 18px; }
  .fold-body li { margin: 3px 0; }

  /* list of places to cross */
  ol.rows { list-style: none; margin: 0; padding: 0; }
  ol.rows li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  ol.rows li:last-child { border-bottom: 0; }
  ol.rows li:hover .nm { text-decoration: underline; }
  .at { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; }

  /* footpath strip */
  .strip { display: grid; grid-template-columns: 92px repeat(5, 1fr); gap: 3px; align-items: center; font-size: 12px; margin: 4px 0 6px; }
  .strip .lab { color: var(--muted); }
  .strip .cell { border-radius: 4px; text-align: center; padding: 7px 0; font-weight: 650; font-variant-numeric: tabular-nums; color: #1d1d1b; cursor: pointer; }
  .strip .ax { text-align: center; color: var(--muted); font-size: 11px; }
  .f-none { background: #ffc9c9; } .f-low { background: #ffd8a8; } .f-mid { background: #ffec99; } .f-ok { background: #b2f2bb; } .f-unknown { background: #e9ecef; }

  /* street sections */
  .xs { margin: 0 0 14px; }
  .xs-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 650; }
  .xs-h span { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .xs svg { display: block; width: 100%; height: auto; margin-top: 5px; border-radius: 4px; }
  .xs-why { font-size: 12px; color: var(--muted); margin-top: 3px; }
  ul.xkey { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  ul.xkey li { display: flex; align-items: center; gap: 5px; }
  ul.xkey i { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
  .callout { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 13px; margin: 0 0 14px; }

  /* site check */
  .progress { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--soft); margin: 6px 0 6px; }
  .progress i { display: block; }
  .tally { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .tally span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--c); }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  details.chk { border-bottom: 1px dashed var(--line); padding: 7px 0; }
  details.chk > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 16px 1fr auto; gap: 9px; align-items: start; font-size: 14px; }
  details.chk > summary::-webkit-details-marker { display: none; }
  .ic { width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; }
  .r-favourable .ic { background: var(--good); } .r-acceptable .ic { background: var(--warn); }
  .r-not_favourable .ic { background: var(--bad); } .r-verify .ic { border: 2px solid var(--muted); border-radius: 3px; }
  .rt { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; margin-top: 3px; }
  .r-favourable .rt { color: var(--good); } .r-acceptable .rt { color: #b07a00; } .r-not_favourable .rt { color: var(--bad); } .r-verify .rt { color: var(--muted); }
  details.chk .fold-body { padding-left: 25px; color: var(--muted); }

  /* ---------- layers control ---------- */
  .layers-btn { position: absolute; top: 16px; right: 16px; z-index: 3; display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.14); font-size: 14px; font-weight: 600; }
  .layers-btn svg { width: 18px; height: 18px; }
  .layers { position: absolute; top: 64px; right: 16px; z-index: 3; width: 290px; max-height: calc(100% - 140px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
    padding: 12px 16px 14px; font-size: 14px; }
  .layers[hidden] { display: none; }
  .layers h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  .layers h4:first-child { margin-top: 0; }
  .layers label { display: flex; align-items: center; gap: 9px; padding: 4px 0; cursor: pointer; }
  .layers label .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .layers .sub { padding-left: 24px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .layers .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .maplibregl-ctrl-top-right { top: 56px; }

  /* about dialog */
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; max-width: 620px; width: calc(100% - 32px);
    background: var(--panel); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 17px; }
  .dlg-body { padding: 4px 20px 18px; font-size: 14px; max-height: 70vh; overflow-y: auto; }
  .dlg-body h3 { margin-top: 18px; }
  .dlg-body ul { padding-left: 18px; margin: 4px 0; }
  .dlg-body li { margin: 4px 0; }

  /* map bits */
  .maplibregl-popup-content { background: var(--panel); color: var(--ink); border-radius: 8px; font: 13px/1.45 system-ui, sans-serif; padding: 10px 14px; }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .pop-k { color: var(--muted); font-size: 12px; }
  .jn-marker { width: 26px; height: 26px; border-radius: 50%; background: #1d1d1b; color: #fff; font: 700 13px system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); cursor: pointer; }
  .xs-marker { background: #1d1d1b; color: #fff; font: 600 12px system-ui, sans-serif; padding: 4px 8px; border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); white-space: nowrap; }

  /* ---------- phones: bottom sheet ---------- */
  @media (max-width: 720px) {
    .story { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 56vh; border-radius: 14px 14px 0 0; transition: height .2s; }
    .story.collapsed { height: 132px; }
    .story.collapsed .story-body, .story.collapsed .story-foot { display: none; }
    .grab { display: block; width: 100%; border: 0; background: none; padding: 8px 0 0; cursor: pointer; }
    .grab::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
    .story-head { padding-top: 6px; }
    .layers-btn { top: 12px; right: 12px; }
    .layers { top: 58px; right: 12px; left: 12px; width: auto; max-height: 40vh; }
    .maplibregl-ctrl-top-right { top: 52px; }
    .headline { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of the study stretch"></div>

<!-- story panel -->
<aside class="story" id="story" aria-label="Study findings">
  <button class="grab" id="grab" aria-label="Expand or collapse the panel"></button>
  <div class="story-head">
    <p class="eyebrow">Tactical urbanism study · Bengaluru</p>
    <h1>100 Feet Road, Madiwala</h1>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="story-body" id="body" role="tabpanel" tabindex="0"></div>
  <div class="story-foot">
    <button class="btn" id="prev">← Previous</button>
    <button class="linkbtn" id="about-open">About the data</button>
    <button class="btn" id="next">Next →</button>
  </div>
</aside>

<!-- layers control -->
<button class="layers-btn" id="layers-btn" aria-expanded="false" aria-controls="layers">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
  Layers
</button>
<div class="layers" id="layers" hidden>
  <h4>Base map</h4>
  <div class="seg" role="group" aria-label="Base map">
    <button id="bm-map" aria-pressed="true">Street map</button>
    <button id="bm-sat" aria-pressed="false">Satellite</button>
  </div>
  <h4>Study</h4>
  <label><input type="checkbox" data-g="crossings"> Crossings &amp; gaps</label>
  <label><input type="checkbox" data-g="footpaths"> Footpath widths</label>
  <label><input type="checkbox" data-g="wall"> Flyover ramp wall</label>
  <label><input type="checkbox" data-g="construction"> Flyover construction</label>
  <h4>Walking distance from the road</h4>
  <label><input type="checkbox" data-g="r300"> 300 m · about 4 min</label>
  <label><input type="checkbox" data-g="r500"> 500 m · about 7 min</label>
  <h4>Places nearby</h4>
  <label><input type="checkbox" data-g="places"> Show places</label>
  <div class="sub" id="cat-list"></div>
  <p class="note">Places are shown within the largest walking distance ticked above (500 m if none). Each tab resets these to suit its story.</p>
</div>

<!-- about -->
<dialog id="about">
  <div class="dlg-head"><h2>About the data</h2><button class="btn" id="about-close">Close</button></div>
  <div class="dlg-body" id="about-body"></div>
</dialog>

<script>
/* =====================================================================
   Content settings — plain-language names used across the page
   ===================================================================== */
const SIDE = { SE: 'IIA side', NW: 'Masjid side' };          // road sides, as locals would name them
const CATS = {                                                // GIZ guidebook neighbourhood-mapping categories
  'Transit': '#2a7de1', 'Institutional': '#e8a200', 'Healthcare': '#d6336c', 'Religious': '#8e5bd6',
  'Recreational': '#2f9e44', 'Public amenities': '#0c8599', 'Commercial': '#8a8780',
};
const CAT_LABEL = { 'Transit': 'Bus stops', 'Institutional': 'Schools & institutes', 'Healthcare': 'Hospitals & clinics',
  'Religious': 'Temples & mosques', 'Recreational': 'Parks & recreation', 'Public amenities': 'Public services', 'Commercial': 'Shops & food' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmt = n => Number(n).toLocaleString('en-IN');
const fromA = m => `${m} m from the Water Tank junction`;

/* =====================================================================
   Map
   ===================================================================== */
const SAT_SOURCE = { type: 'raster', tileSize: 256, maxzoom: 19,
  tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
  attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' };
const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [77.6195, 12.926], zoom: 16, attributionControl: { compact: true } });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

// layer groups toggled by the story and the Layers control
const GROUPS = {
  crossings:    ['ct-zone', 'xg-gap', 'xg-gap-label', 'xg-desire', 'xg-tick', 'xg-tick-label', 'xg-gen', 'xg-cross'],
  footpaths:    ['ct-fp', 'ct-fp-label'],
  wall:         ['ct-wall'],
  construction: ['cons-casing', 'cons'],
  places:       ['poi', 'poi-label'],
  r300:         ['ring-300-casing', 'ring-300', 'ring-300-label'],
  r500:         ['ring-500-casing', 'ring-500', 'ring-500-label'],
  sat:          ['sat'],
};
const vis = { crossings: false, footpaths: false, wall: false, construction: false, places: false, r300: false, r500: false, sat: false };
const catOn = Object.fromEntries(Object.keys(CATS).map(k => [k, true]));
const poiRange = () => vis.r500 ? 500 : vis.r300 ? 300 : 500;
const poiFilter = () => ['all', ['in', ['get', 'category'], ['literal', Object.keys(CATS).filter(k => catOn[k])]], ['<=', ['get', 'dist_m'], poiRange()]];

function applyVis() {
  for (const [g, ids] of Object.entries(GROUPS))
    ids.forEach(id => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', vis[g] ? 'visible' : 'none'));
  map.getLayer('poi') && map.setFilter('poi', poiFilter());
  map.getLayer('poi-label') && map.setFilter('poi-label', ['all', poiFilter(), ['!=', ['get', 'category'], 'Commercial']]);
  document.querySelectorAll('#layers [data-g]').forEach(i => i.checked = vis[i.dataset.g]);
  document.getElementById('bm-map').setAttribute('aria-pressed', String(!vis.sat));
  document.getElementById('bm-sat').setAttribute('aria-pressed', String(vis.sat));
  refreshCats();
}

let D = {};   // all loaded data
const load = Promise.all([
  'data/stretch.geojson', 'data/poi.geojson', 'data/catchments.geojson', 'data/crossings.geojson',
  'data/construction.geojson', 'data/scorecard.json', 'data/contract.json', 'data/contract.geojson',
].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); })))
  .then(([stretch, poi, catchments, crossings, construction, scorecard, contract, contractGeo]) =>
    (D = { stretch, poi, catchments, crossings, construction, scorecard, contract, contractGeo }));

function addOverlays() {
  const K = k => ['==', ['get', 'kind'], k];
  const hidden = { visibility: 'none' };
  const src = (id, data) => map.getSource(id) || map.addSource(id, { type: 'geojson', data });
  src('stretch', D.stretch); src('poi', D.poi); src('catchments', D.catchments); src('xing', D.crossings);
  src('construction', D.construction); src('contract', D.contractGeo);
  if (!map.getSource('sat')) map.addSource('sat', SAT_SOURCE);
  const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  map.addLayer({ id: 'sat', type: 'raster', source: 'sat', layout: hidden }, firstSymbol);

  // walking distance rings
  for (const r of [500, 300]) {
    const f = ['==', ['get', 'radius_m'], r];
    map.addLayer({ id: `ring-${r}-casing`, type: 'line', source: 'catchments', filter: f, layout: hidden,
      paint: { 'line-color': '#fff', 'line-width': 5, 'line-opacity': 0.55 } });
    map.addLayer({ id: `ring-${r}`, type: 'line', source: 'catchments', filter: f,
      layout: { ...hidden, 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#1d1d1b', 'line-opacity': r === 300 ? 0.9 : 0.55, 'line-width': 2.5, 'line-dasharray': [0, 2] } });
    map.addLayer({ id: `ring-${r}-label`, type: 'symbol', source: 'catchments', filter: f,
      layout: { ...hidden, 'symbol-placement': 'line', 'symbol-spacing': 420, 'text-field': ['get', 'label'],
        'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-offset': [0, -0.9] },
      paint: { 'text-color': '#1d1d1b', 'text-halo-color': '#fff', 'text-halo-width': 1.6 } });
  }

  // flyover construction (OSM)
  map.addLayer({ id: 'cons-casing', type: 'line', source: 'construction', layout: hidden,
    paint: { 'line-color': '#f0c27b', 'line-width': ['interpolate', ['linear'], ['zoom'], 15, 5, 19, 16], 'line-opacity': 0.85 } });

/* =====================================================================

const OSM = o => `<a href="https://www.openstreetmap.org/${esc(o)}" target="_blank" rel="noopener">OpenStreetMap</a>`;
const POPUPS = {
  'poi': f => { const p = f.properties; return [f.geometry.coordinates,

  'xg-gen': f => { const p = f.properties; return [f.geometry.coordinates,
    `<strong>${esc(p.name)}</strong><br>People cross the road to reach this<br><span class="pop-k">${fromA(p.chainage_m)} · ${esc(SIDE[p.side.split(' ')[0]] || p.side)}</span>`]; },
  'ct-fp': f => { const p = f.properties; return [f.geometry.coordinates,

    `<br><span class="pop-k">Standard for a busy mixed-use street: 2.5 m. Measured in the flyover contract's survey.</span>`]; },
  'xg-tick': f => [f.geometry.coordinates, `<strong>${fromA(f.properties.chainage_m)}</strong>`],
  'ct-wall': (f, e) => [e.lngLat, `<strong>Flyover ramp wall</strong><br>A solid ${f.properties.width_m} m wall of packed earth down the middle of the road, ${f.properties.from_m}–${f.properties.to_m} m from the Water Tank junction. No one can cross here.`],
  'xg-gap': (f, e) => { const p = f.properties; return [e.lngLat,
    `<strong>${p.length_m} m with no crossing</strong><br><span class="pop-k">The guidebook asks for one every 80–150 m on a busy street like this.</span>`]; },
  'ct-zone': (f, e) => { const p = f.properties; return [e.lngLat, p.status === 'feasible'
    ? `<strong>A crossing is possible here</strong><br><span class="pop-k">${p.from_m}–${p.to_m} m from the Water Tank junction. The middle of the road is open, so a crossing with a safe island in the middle can fit.</span>`
    : `<strong>No crossing possible</strong><br><span class="pop-k">The flyover ramp wall fills the middle of the road here.</span>`]; },
  'stretch-line': (f, e) => { const p = f.properties; return [e.lngLat,

  'cons': (f, e) => [e.lngLat, `<strong>${esc(f.properties.name)}</strong><br>${f.properties.elevated ? 'Raised section' : 'Ramp / works at street level'}`],
};
const CLICKABLE = Object.keys(POPUPS);
const hitsAt = pt => map.queryRenderedFeatures([[pt.x - 5, pt.y - 5], [pt.x + 5, pt.y + 5]], { layers: CLICKABLE.filter(id => map.getLayer(id)) });
map.on('click', e => {
  const hits = hitsAt(e.point); if (!hits.length) return;
  const top = CLICKABLE.map(id => hits.find(h => h.layer.id === id)).find(Boolean);
  const [ll, html] = POPUPS[top.layer.id](top, e);
  new maplibregl.Popup({ offset: 8, maxWidth: '280px' }).setLngLat(ll).setHTML(html).addTo(map);
});
map.on('mousemove', e => { map.getCanvas().style.cursor = hitsAt(e.point).length ? 'pointer' : ''; });

/* =====================================================================
   Story — each tab sets the map and renders its own content
   ===================================================================== */
const pad = () => innerWidth <= 720
  ? { top: 70, bottom: innerHeight * 0.58, left: 24, right: 24 }
  : { top: 70, bottom: 50, left: 420, right: 60 };
const boundsOf = coords => coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
const roadCoords = () => D.stretch.features.flatMap(f => f.geometry.type === 'Point' ? [f.geometry.coordinates] : f.geometry.coordinates);
const fitRoad = () => map.fitBounds(boundsOf(roadCoords()), { padding: pad(), maxZoom: 18, duration: 900 });
const flyTo = ll => map.flyTo({ center: ll, zoom: 18.3, padding: pad(), duration: 900 });
const key = items => `<ul class="key">${items.map(([sw, t]) => `<li>${sw}<span>${t}</span></li>`).join('')}</ul>`;
const fold = (title, html, open = false, count = '') =>
  `<details class="fold"${open ? ' open' : ''}><summary>${title}${count !== '' ? `<span class="count">${count}</span>` : ''}</summary><div class="fold-body">${html}</div></details>`;
let sectionMarker;

function gapStats() {
  const gaps = D.crossings.features.filter(f => f.properties.kind === 'gap').map(f => f.properties);
  const longest = Math.max(...gaps.map(g => g.length_m));
  const need = gaps.reduce((a, g) => a + g.crossings_needed, 0);
  const feas = D.contractGeo.features.find(f => f.properties.kind === 'zone' && f.properties.status === 'feasible').properties;
  return { longest, need, feas, wall: D.contract.re_wall };
}
function fpStats() {
  const v = D.contract.inventory.rows.flatMap(r => [r.fp_lhs, r.fp_rhs]);
  return { total: v.length, below: v.filter(x => x < 2.5).length, none: D.contract.inventory.rows.filter(r => !r.fp_lhs && !r.fp_rhs).map(r => r.ch) };
}
function trafficStats() {
  const t = D.contract.traffic, round = n => Math.round(n / 500) * 500;
  return { t, low: round(t.adt_2025 - t.diverted_od), high: round(t.adt_2025 - t.diverted_tollable) };
}

  { id: 'crossing', tab: 'Crossing',

      const n = r => C.filter(c => c.rating === r).length;
      const known = C.filter(c => c.rating !== 'verify'), todo = C.filter(c => c.rating === 'verify');
      const seg = (r, col) => `<i style="width:${n(r) / C.length * 100}%;background:${col}"></i>`;
      const item = c => `<details class="chk r-${c.rating}"><summary><span class="ic"></span><span>${esc(c.question)}</span><span class="rt">${esc(sc.ratings[c.rating].replace(' on the walk', ''))}</span></summary>
        <div class="fold-body">${esc(c.finding)}<br><em>${esc(c.source)}</em></div></details>`;
      return `
        <h2 class="headline">Is the site ready for a trial? ${known.length} of ${C.length} checks done</h2>
        <p class="lede">The guidebook's site checklist. Most of the street is a good fit; the flyover construction is the one strong
        reason for caution. The rest needs a walk along the road — ideally at the morning or evening rush.</p>
        <div class="progress">${seg('favourable', '#2f9e44')}${seg('acceptable', '#e8a200')}${seg('not_favourable', '#c92a2a')}</div>
        <div class="tally"><span style="--c:#2f9e44">${n('favourable')} good</span><span style="--c:#e8a200">${n('acceptable')} okay</span>
          <span style="--c:#c92a2a">${n('not_favourable')} a concern</span><span style="--c:#adb5bd">${todo.length} to check</span></div>
        <h3>To check on the walk</h3>${todo.map(item).join('')}
        <h3>Already known</h3>${known.map(item).join('')}
        <p class="small" style="margin-top:12px">Tap a row for the evidence. Ratings live in <code>data/scorecard.json</code> — update it after the walk.</p>`;
    } },
];

// street-section helpers
function sectionPoint() {
  const t = D.crossings.features.filter(f => f.properties.kind === 'tick');
  const a = t.find(f => f.properties.chainage_m === 300).geometry.coordinates, b = t.find(f => f.properties.chainage_m === 350).geometry.coordinates;
  const k = (D.contract.sections.ch - 300) / 50;
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
const PART = {
  drain: { c: '#ced4da', t: '#1d1d1b', name: 'Drain' }, foot: { c: '#f2c979', t: '#1d1d1b', name: 'Footpath' },
  ext: { c: '#f59f00', t: '#1d1d1b', name: 'Wider footpath (trial)' }, bay: { c: '#74c0fc', t: '#1d1d1b', name: 'Bus stop / vending / parking' },
  buffer: { c: '#b2f2bb', t: '#1d1d1b', name: 'Buffer' }, car: { c: '#495057', t: '#fff', name: 'Vehicle lanes' },
  median: { c: '#868e96', t: '#fff', name: 'Middle strip' }, pier: { c: '#212529', t: '#fff', name: 'Flyover pillar' },
  unspecified: { c: 'none', t: '#6b6a65', name: 'Not specified' },
};
const SECTION_WHY = {
  existing: 'Most of the width goes to vehicles.',
  tcs09: 'Same footpaths as today; vehicles keep almost everything.',
  text: 'A narrow road with wide footpaths — but where the other 12 m goes is not said.',
  tactical: 'Two lanes each way, wider footpaths and space for bus stops and vendors — testable in a week with cones and paint.',
};
function sectionsHTML() {
  const items = D.contract.sections.items, full = Math.max(...items.map(it => it.parts.reduce((a, p) => a + p[1], 0)));
  const W = 300, H = 34, k = W / full;
  const bars = items.map(it => {
    let x = 0, walk = 0, drive = 0;
    const rects = it.parts.map(([type, m]) => {
      const s = PART[type], w = m * k;
      const r = `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${H}" fill="${s.c}" ${type === 'unspecified' ? 'stroke="#adb5bd" stroke-dasharray="3 2"' : 'stroke="#fff" stroke-width=".6"'}><title>${s.name}: ${m} m</title></rect>` +
        (w >= 13 ? `<text x="${(x + w / 2).toFixed(2)}" y="${H / 2 + 4}" text-anchor="middle" font-size="10" fill="${s.t}">${+m.toFixed(2)}</text>` : '');
      x += w; if (type === 'foot' || type === 'ext') walk += m; if (type === 'car') drive += m;
      return r;
    }).join('');
    return `<div class="xs"><div class="xs-h">${esc(it.title)}<span>people ${+walk.toFixed(1)} m · vehicles ${+drive.toFixed(1)} m</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(it.title)}: ${it.parts.map(p => PART[p[0]].name + ' ' + p[1] + ' m').join(', ')}">${rects}</svg>
      <div class="xs-why">${esc(SECTION_WHY[it.id] || '')}</div></div>`;
  }).join('');
  const used = new Set(items.flatMap(it => it.parts.map(p => p[0])));
  const legend = `<ul class="xkey">${Object.entries(PART).filter(([t]) => used.has(t)).map(([t, s]) =>
    `<li><i style="background:${s.c};${t === 'unspecified' ? 'border:1px dashed #adb5bd' : ''}"></i>${s.name}</li>`).join('')}</ul>`;
  return `<p class="small" style="margin:0 0 8px">Cross-sections 330 m from the Water Tank junction, drawn to scale across the ~30 m between property walls (numbers in metres).</p>${bars}${legend}`;
}

/* tabs, navigation, deep links */
const tabsEl = document.getElementById('tabs'), body = document.getElementById('body');
tabsEl.innerHTML = SCENES.map(s => `<button class="tab" role="tab" id="tab-${s.id}" data-id="${s.id}" aria-selected="false">${s.tab}</button>`).join('');
let current = null;
function show(id, { fly = true } = {}) {
  const i = Math.max(0, SCENES.findIndex(s => s.id === id)), s = SCENES[i];
  if (current && current !== s) current.leave?.();
  const entering = current !== s;
  current = s;
  tabsEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.id === s.id)));
  document.getElementById(`tab-${s.id}`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  body.setAttribute('aria-labelledby', `tab-${s.id}`);
  body.innerHTML = s.render(); body.scrollTop = 0;
  Object.keys(vis).forEach(g => { if (g !== 'sat') vis[g] = !!s.layers[g]; });
  if (map.getLayer('poi')) applyVis(); else refreshCats();
  if (entering) s.enter?.();
  if (fly) s.view();
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === SCENES.length - 1;
  document.getElementById('next').textContent = i < SCENES.length - 1 ? `${SCENES[i + 1].tab} →` : 'Next →';
  if (location.hash.slice(1) !== s.id) history.replaceState(null, '', '#' + s.id);
}
tabsEl.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) show(t.dataset.id); });
tabsEl.addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const i = SCENES.indexOf(current) + (e.key === 'ArrowRight' ? 1 : -1);
  if (SCENES[i]) { show(SCENES[i].id); document.getElementById(`tab-${SCENES[i].id}`).focus(); }
});
document.getElementById('prev').onclick = () => { const i = SCENES.indexOf(current); if (i > 0) show(SCENES[i - 1].id); };
document.getElementById('next').onclick = () => { const i = SCENES.indexOf(current); if (i < SCENES.length - 1) show(SCENES[i + 1].id); };
body.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) return show(go.dataset.go);
  const row = e.target.closest('[data-ll]'); if (row) return flyTo(row.dataset.ll.split(',').map(Number));
  const cell = e.target.closest('[data-ch]');
  if (cell) { const f = D.contractGeo.features.find(f => f.properties.kind === 'survey' && f.properties.chainage_m === +cell.dataset.ch); if (f) flyTo(f.geometry.coordinates); }
});
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current?.id) show(id); });

// phones: tap the handle to collapse/expand the sheet
document.getElementById('grab').onclick = () => document.getElementById('story').classList.toggle('collapsed');

/* layers control */
const layersBtn = document.getElementById('layers-btn'), layersEl = document.getElementById('layers');
layersBtn.onclick = () => { layersEl.hidden = !layersEl.hidden; layersBtn.setAttribute('aria-expanded', String(!layersEl.hidden)); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !layersEl.hidden) { layersEl.hidden = true; layersBtn.setAttribute('aria-expanded', 'false'); layersBtn.focus(); } });
layersEl.addEventListener('change', e => {
  const g = e.target.dataset.g, c = e.target.dataset.cat;
  if (g) vis[g] = e.target.checked;
  if (c) { catOn[c] = e.target.checked; if (e.target.checked) vis.places = true; }
  applyVis();
});
document.getElementById('bm-map').onclick = () => { vis.sat = false; applyVis(); };
document.getElementById('bm-sat').onclick = () => { vis.sat = true; applyVis(); };
const catList = document.getElementById('cat-list');
catList.innerHTML = Object.entries(CATS).map(([k, c]) =>
  `<label><input type="checkbox" data-cat="${k}" checked><span class="sw sw-dot" style="background:${c};border-color:#fff;width:11px;height:11px"></span>${CAT_LABEL[k]}<span class="n" data-n="${k}"></span></label>`).join('');
function refreshCats() {
  if (!D.poi) return;
  for (const k of Object.keys(CATS)) {
    catList.querySelector(`[data-n="${k}"]`).textContent = D.poi.features.filter(f => f.properties.category === k && f.properties.dist_m <= poiRange()).length;
    catList.querySelector(`[data-cat="${k}"]`).checked = catOn[k];
  }
}

/* about the data */
const about = document.getElementById('about');
document.getElementById('about-open').onclick = () => {
  const c = D.contract?.source || {};
  document.getElementById('about-body').innerHTML = `
    <h3>What this is</h3>
    <p>A study of 100 Feet Road (Mahayogi Vemana Road) between the Koramangala Water Tank junction (A) and the Madiwala underpass (B),
    following the site-selection and site-appraisal steps of two tactical urbanism guidebooks. Distances along the road are measured
    from junction A.</p>
    <h3>Sources</h3><ul>
      <li>Directorate of Urban Land Transport (DULT), Govt. of Karnataka — <em>Guidebook for Tactical Urbanism</em>, 2022.</li>
      <li>GIZ / MoHUA — <em>A Tactical Urbanism Guidebook</em>, 2020 (site scoring sheet, crossing spacing, footpath widths after IRC 103).</li>
      <li>${esc(c.client || 'B-SMILE')} — elevated-corridor tender, Schedules A–I (${esc(c.status || '')}) and its OD &amp; toll analysis.</li>
      <li>OpenStreetMap contributors — road geometry, crossings, places nearby, construction.</li>
      <li>Esri World Imagery — satellite view and visual checks.</li></ul>
    <h3>Known gaps</h3><ul>
      <li>OpenStreetMap misses most street vendors and small shops.</li>
      <li>The contract is a tender: chainages and designs may change.</li>
      <li>Footpath sides are inferred from the contract's LHS/RHS labels.</li>
      <li>Traffic figures cover the whole Indiranagar–Silk Board corridor and are projections.</li>
      <li>${D.scorecard.criteria.filter(x => x.rating === 'verify').length} site-check items still need the walk.</li></ul>
    <h3>For developers</h3>
    <p class="small">Data lives in <code>data/</code>; rebuild scripts are in <code>scripts/</code> (each has usage notes at the top).</p>`;
  about.showModal();
};
document.getElementById('about-close').onclick = () => about.close();
about.addEventListener('click', e => { if (e.target === about) about.close(); });

/* start */
load.then(() => show(location.hash.slice(1) || 'overview'))
  .catch(err => { body.innerHTML = `<p class="lede">Sorry — the map data didn't load (${esc(err.message)}). If you opened the file directly, serve the folder with <code>python3 -m http.server</code>.</p>`; });
</script>
</body>
